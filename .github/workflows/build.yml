name: Build EEBBK UMS512 kernel recovery upgrade

on:
  workflow_dispatch:
    inputs:
      device:
        description: Target device
        type: choice
        required: true
        default: p22h190
        options:
          - p22h190
          - p21h170
      profile:
        description: Build profile
        type: choice
        required: true
        default: standard
        options:
          - standard
          - droidspaces

permissions:
  contents: write

concurrency:
  group: ${{ inputs.device || 'p22h190' }}-${{ inputs.profile || 'standard' }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ARCH: arm64
      SUBARCH: arm64
      CLANG_TRIPLE: aarch64-linux-gnu-
      CROSS_COMPILE: aarch64-linux-android-
      ANYKERNEL_DIR: ${{ github.workspace }}/out/AnyKernel3
      KPM_PATCHER: ${{ github.workspace }}/out/tools/patch_linux

    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fetch Android clang r487747c (clang 17.0.2, as used locally)
        shell: bash
        run: |
          set -euo pipefail
          CLANG_NAME=clang-r487747c
          CLANG_ROOT="$RUNNER_TEMP/$CLANG_NAME"
          CLANG_DIR="$CLANG_ROOT/$CLANG_NAME/bin"
          CLANG_REPO="$RUNNER_TEMP/clang-repo"
          mkdir -p "$CLANG_ROOT" out
          # clang-r487747c lives in the Android 14 release branch; fall back to
          # main in case the branch is ever re-pointed.
          for branch in android14-release main; do
            rm -rf "$CLANG_REPO"
            git clone --depth=1 --filter=blob:none --sparse \
              --branch "$branch" \
              https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
              "$CLANG_REPO"
            git -C "$CLANG_REPO" sparse-checkout set "$CLANG_NAME"
            [ -d "$CLANG_REPO/$CLANG_NAME" ] && break
          done
          test -d "$CLANG_REPO/$CLANG_NAME"
          cp -a "$CLANG_REPO/$CLANG_NAME" "$CLANG_ROOT/"
          test -x "$CLANG_DIR/clang"
          "$CLANG_DIR/clang" --version | tee out/clang-version.txt
          # must be the same toolchain the local Lineage kernel build uses
          grep -F 'clang version 17.0.2' out/clang-version.txt
          printf 'CLANG_DIR=%s\n' "$CLANG_DIR" >> "$GITHUB_ENV"

      - name: Fetch AOSP aarch64 GCC 4.9 binutils (as used locally)
        shell: bash
        run: |
          set -euo pipefail
          GCC_DIR="$RUNNER_TEMP/aarch64-linux-android-4.9"
          rm -rf "$GCC_DIR"
          git clone --depth=1 --filter=blob:none \
            --branch android12-release \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            "$GCC_DIR"
          test -x "$GCC_DIR/bin/aarch64-linux-android-objcopy"
          test -x "$GCC_DIR/bin/aarch64-linux-android-nm"
          "$GCC_DIR/bin/aarch64-linux-android-objcopy" --version | head -1
          printf 'ANDROID_GCC_DIR=%s\n' "$GCC_DIR" >> "$GITHUB_ENV"

      - name: Select build profile
        shell: bash
        env:
          BUILD_DEVICE: ${{ inputs.device || 'p22h190' }}
          BUILD_PROFILE: ${{ inputs.profile || 'standard' }}
        run: |
          set -euo pipefail
          case "$BUILD_DEVICE" in
            p22h190)
              KERNEL_PREFIX=P22H190
              BUILD_SCRIPT=./scripts/build-p22h190.sh
              SOCKO="$GITHUB_WORKSPACE/prebuilts/p22h190/socko.factory.img"
              case "$BUILD_PROFILE" in
                standard)
                  profile=p22h190
                  defconfig=ums512-p22h190_defconfig
                  build_dir="$GITHUB_WORKSPACE/out/ums512-p22h190"
                  release_dir="$GITHUB_WORKSPACE/out/release"
                  ;;
                droidspaces)
                  profile=droidspaces
                  defconfig=ums512-p22h190_droidspaces_defconfig
                  build_dir="$GITHUB_WORKSPACE/out/ums512-p22h190-droidspaces"
                  release_dir="$GITHUB_WORKSPACE/out/release-droidspaces"
                  ;;
                *)
                  echo "unsupported profile: $BUILD_PROFILE" >&2
                  exit 2
                  ;;
              esac
              ;;
            p21h170)
              if [ "$BUILD_PROFILE" != standard ]; then
                echo "the droidspaces profile is only implemented for p22h190" >&2
                exit 2
              fi
              KERNEL_PREFIX=P21H170
              BUILD_SCRIPT=./scripts/build-p21h170.sh
              SOCKO="$GITHUB_WORKSPACE/prebuilts/p21h170/socko.factory.img"
              profile=p21h170
              defconfig=ums512-p21h170_defconfig
              build_dir="$GITHUB_WORKSPACE/out/ums512-p21h170"
              release_dir="$GITHUB_WORKSPACE/out/release"
              ;;
            *)
              echo "unsupported device: $BUILD_DEVICE" >&2
              exit 2
              ;;
          esac
          {
            printf 'KERNEL_PREFIX=%s\n' "$KERNEL_PREFIX"
            printf 'BUILD_SCRIPT=%s\n' "$BUILD_SCRIPT"
            printf 'SOCKO_TEMPLATE=%s\n' "$SOCKO"
            printf 'KERNEL_PROFILE=%s\n' "$profile"
            printf 'KERNEL_DEFCONFIG=%s\n' "$defconfig"
            printf 'BUILD_DIR=%s\n' "$build_dir"
            printf 'RELEASE_DIR=%s\n' "$release_dir"
          } >> "$GITHUB_ENV"
          printf 'device=%s profile=%s\ndefconfig=%s\nbuild_dir=%s\nrelease_dir=%s\n' \
            "$BUILD_DEVICE" "$profile" "$defconfig" "$build_dir" "$release_dir"

      - name: Install build and packaging dependencies
        run: |
          set -euo pipefail
          # GitHub's mirror list occasionally prioritizes an unreachable Azure
          # mirror. Keep the upstream archive candidate and bound retries.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '\|azure\.archive\.ubuntu\.com/ubuntu|d' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y \
            bc binutils bison cpio device-tree-compiler e2fsprogs fuse2fs \
            flex fuse3 git kmod libelf-dev libncurses-dev \
            libssl-dev libyaml-dev lld perl python3 rsync unzip zip

      - name: Fetch KPM patcher and AnyKernel3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/tools
          curl -fL --retry 3 --connect-timeout 15 --max-time 180 \
            https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/main/kpm/patch_linux \
            -o "$KPM_PATCHER"
          echo '1bd00563e9d8fbbd11a16c0c1c59c5add406e6c5c92557def50f93d6f0aebe2d  out/tools/patch_linux' \
            | sha256sum --check
          chmod 755 "$KPM_PATCHER"
          file "$KPM_PATCHER"
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git "$ANYKERNEL_DIR"
          test -f "$ANYKERNEL_DIR/anykernel.sh"

      - name: Build recovery upgrade package
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out
          env \
            ANDROID_CLANG_DIR="$CLANG_DIR" \
            ANDROID_GCC_DIR="$ANDROID_GCC_DIR" \
            "${KERNEL_PREFIX}_PROFILE=$KERNEL_PROFILE" \
            "${KERNEL_PREFIX}_DEFCONFIG=$KERNEL_DEFCONFIG" \
            "${KERNEL_PREFIX}_BUILD_DIR=$BUILD_DIR" \
            "${KERNEL_PREFIX}_OUTPUT_DIR=$RELEASE_DIR" \
            SOCKO_TEMPLATE="$SOCKO_TEMPLATE" \
            ANYKERNEL_DIR="$ANYKERNEL_DIR" \
            KPM_PATCHER="$KPM_PATCHER" \
            JOBS="$(nproc)" \
            "$BUILD_SCRIPT" all 2>&1 | tee out/build.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Verify recovery upgrade package
        shell: bash
        run: |
          set -euo pipefail
          ls -lh "$RELEASE_DIR"
          package=$(find "$RELEASE_DIR" -maxdepth 1 -type f \
            -name "${KERNEL_PREFIX}-recovery-*.zip" -size +1c -print -quit)
          test -n "$package"
          test "$(find "$RELEASE_DIR" -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 1
          sha256sum "$package"

      - name: Upload build package artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.device || 'p22h190' }}-${{ inputs.profile || 'standard' }}-packages-${{ github.sha }}
          path: |
            out/release*/*-recovery-*.zip
          if-no-files-found: warn
          compression-level: 0

      - name: Create GitHub Release
        if: github.event_name != 'pull_request' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.device || 'p22h190' }}-${{ inputs.profile || 'standard' }}-${{ github.sha }}-${{ github.run_number }}
          name: ${{ inputs.device || 'p22h190' }} ${{ inputs.profile || 'standard' }} kernel ${{ github.sha }}
          prerelease: true
          generate_release_notes: false
          files: |
            out/release*/*-recovery-*.zip
